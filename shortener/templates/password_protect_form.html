{% extends 'shortener/base.html' %}

{% block title %}Password Required{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-center mb-6">Password Required</h1>
        <p class="text-gray-700 text-center mb-4">This URL is password protected. Please enter the password to proceed.</p>
        {% if error %}
            <p class="text-red-500 text-center mb-4">{{ error }}</p>
        {% endif %}
        <form method="post" action="/{{ short_url }}/" class="space-y-4">
            {% csrf_token %}
            <input type="password" name="password" placeholder="Enter password" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Submit
            </button>
        </form>
    </div>
</div>
{% endblock %}
