<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autenticación requerida</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="text-center bg-white p-8 shadow-md rounded">
      <h1 class="text-3xl font-bold text-gray-800 mb-4">
        Autenticación requerida
      </h1>
      <p class="text-gray-600 mb-6">
        Esta URL es privada. Por favor, proporciona un token válido para
        continuar.
      </p>
      <form method="GET" action="">
        <input
          type="text"
          name="token"
          placeholder="Ingresa el token"
          class="border border-gray-300 rounded px-4 py-2 mb-4 w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <button
          type="submit"
          class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-700"
        >
          Enviar
        </button>
      </form>
      <a href="/" class="text-blue-500 hover:text-blue-700 text-sm mt-4 block"
        >Volver a la página principal</a
      >
    </div>
  </body>
</html>
