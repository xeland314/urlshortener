{% extends 'shortener/base.html' %}

{% block title %}Shorten Your URL{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h1 class="text-2xl font-bold text-center mb-6">Shorten Your URL</h1>
    <form hx-post="{% url 'shortener-list-create' %}" hx-target="#shortened-result" hx-swap="innerHTML" class="space-y-4">
        {% csrf_token %}
        <input type="url" name="long_url" placeholder="Enter your long URL" required
               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        
        <div class="flex items-center">
            <input type="checkbox" id="is_private" name="is_private" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="is_private" class="ml-2 block text-sm text-gray-900">Private URL (token-based)</label>
        </div>

        <div class="flex items-center">
            <input type="checkbox" id="has_password" name="has_password" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="has_password" class="ml-2 block text-sm text-gray-900">Password Protected</label>
        </div>

        <div id="password-field" class="hidden">
            <input type="password" name="password" placeholder="Enter password" 
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            Shorten
        </button>
    </form>

    <div id="shortened-result" class="mt-6 p-4 bg-gray-50 rounded-md border border-gray-200">
        <!-- Shortened URL will be displayed here -->
    </div>
</div>

<script>
    document.getElementById('has_password').addEventListener('change', function() {
        var passwordField = document.getElementById('password-field');
        if (this.checked) {
            passwordField.classList.remove('hidden');
        } else {
            passwordField.classList.add('hidden');
        }
    });
</script>
{% endblock %}
