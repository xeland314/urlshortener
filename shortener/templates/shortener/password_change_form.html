<div id="shortener-{{ shortener.short_url }}" class="bg-white p-4 rounded-lg shadow-md mb-4">
    <div class="flex justify-between items-center mb-2">
        <h3 class="text-lg font-semibold text-blue-600">/{{ shortener.short_url }}</h3>
        <span class="text-sm text-gray-500">Clicks: {{ shortener.times_followed }}</span>
    </div>
    <p class="text-gray-700 break-all">Long URL: <a href="{{ shortener.long_url }}" target="_blank" class="text-blue-500 hover:underline">{{ shortener.long_url }}</a></p>
    
    <p class="text-gray-600">Type: Password Protected</p>
    <form hx-patch="{% url 'shortener-change-password' short_url=shortener.short_url %}" hx-target="#shortener-{{ shortener.short_url }}" hx-swap="outerHTML" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="mt-2 space-y-2">
        {% csrf_token %}
        <input type="password" name="password" placeholder="Enter new password" required
               class="w-full px-3 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit"
                class="px-3 py-1 bg-green-500 text-white rounded-md text-sm hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
            Set New Password
        </button>
        <button type="button" hx-get="{% url 'shortener-get-card' short_url=shortener.short_url %}" hx-target="#shortener-{{ shortener.short_url }}" hx-swap="outerHTML"
                class="ml-2 px-3 py-1 bg-gray-500 text-white rounded-md text-sm hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
            Cancel
        </button>
    </form>

    <button hx-delete="{% url 'shortener-detail-update-destroy' short_url=shortener.short_url %}" hx-confirm="Are you sure you want to delete this shortener?"
            hx-target="#shortener-{{ shortener.short_url }}" hx-swap="outerHTML"
            class="mt-2 ml-2 px-3 py-1 bg-red-500 text-white rounded-md text-sm hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
        Delete
    </button>
</div>
