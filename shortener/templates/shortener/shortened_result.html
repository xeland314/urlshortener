<div class="mt-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-md">
    <p class="font-bold">Shortened URL:</p>
    <a href="/{{ short_url }}" target="_blank" class="text-blue-600 hover:underline">{{ request.build_absolute_uri }}/{{ short_url }}</a>
    {% if access_token %}
        <p class="mt-2 font-bold">Access Token (for private URLs):</p>
        <p class="break-all">{{ access_token }}</p>
        <p class="text-sm text-gray-600">Append ?token={{ access_token }} to the URL to access private links.</p>
    {% endif %}
</div>
