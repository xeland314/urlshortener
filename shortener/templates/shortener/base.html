<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}URL Shortener{% endblock %}</title>
    <link href="/static/dist/output.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
    <nav class="bg-gray-800 p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-lg font-bold">URL Shortener</a>
            
            <!-- Hamburger menu button for small screens -->
            <button id="menu-button" class="md:hidden focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- Navigation links -->
            <div id="menu" class="hidden md:flex md:items-center md:space-x-4 flex-col md:flex-row mt-4 md:mt-0 w-full md:w-auto md:static md:top-auto md:left-auto bg-gray-800 md:bg-transparent p-4 md:p-0 z-10 text-white">
                {% if user.is_authenticated %}
                    <span class="block md:inline-block mb-2 md:mb-0 md:mr-4">Welcome, {{ user.username }}</span>
                    <a href="{% url 'admin:index' %}" class="block md:inline-block mb-2 md:mb-0 md:mr-4 hover:underline">My Shorteners</a>
                    <a href="{% url 'logout' %}" class="block md:inline-block hover:underline">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="block md:inline-block mb-2 md:mb-0 md:mr-4 hover:underline">Login</a>
                    <a href="{% url 'register' %}" class="block md:inline-block hover:underline">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="flex-grow container mx-auto p-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-gray-800 text-white p-4 text-center mt-auto">
        <p>Desarrollado por xeland314</p>
        <p><a href="https://github.com/xeland314" target="_blank" class="text-blue-400 hover:underline">GitHub</a></p>
    </footer>

    <script>
        document.getElementById('menu-button').addEventListener('click', function() {
            var menu = document.getElementById('menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        });
    </script>
</body>
</html>
